name: 每日密码更新

on:
  schedule:
    # 北京时间 00:00 = UTC 16:00
    - cron: '0 16 * * *'
  # 允许手动触发测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate-password:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成今日密码
        id: gen
        run: |
          # 生成6位随机密码（字母+数字，容易输入）
          PASSWORD=$(cat /dev/urandom | tr -dc 'a-z0-9' | head -c6)
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT
          # 计算 SHA-256 哈希
          HASH=$(echo -n "$PASSWORD" | sha256sum | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          # 今天的日期（北京时间）
          TODAY=$(TZ='Asia/Shanghai' date +'%Y年%m月%d日')
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "✅ 今日密码: $PASSWORD"
          echo "✅ SHA-256: $HASH"

      - name: 更新加密页面密码
        run: |
          NEW_HASH="${{ steps.gen.outputs.hash }}"
          # 替换 meta 标签中的哈希
          sed -i "s/content=\"[a-f0-9]\{64\}\"/content=\"${NEW_HASH}\"/" mima.html
          # 替换 JavaScript 中的哈希
          sed -i "s/PWD_HASH = \"[a-f0-9]\{64\}\"/PWD_HASH = \"${NEW_HASH}\"/" mima.html
          echo "✅ mima.html 已更新为新密码哈希"

      - name: 发送密码邮件到 QQ 邮箱
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_SMTP_CODE }}
          subject: 🔐 Claude Code 教程 — ${{ steps.gen.outputs.today }} 每日密码
          to: 2914079658@qq.com
          from: ${{ secrets.QQ_EMAIL }}
          priority: high
          html_body: |
            <div style="font-family:sans-serif;max-width:500px;margin:0 auto;background:#161b22;color:#c9d1d9;padding:30px;border-radius:12px;">
              <h2 style="color:#58a6ff;">🔐 今日访问密码</h2>
              <p>日期：<strong>${{ steps.gen.outputs.today }}</strong></p>
              <div style="background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:20px;text-align:center;margin:20px 0;">
                <span style="font-size:2em;font-family:monospace;letter-spacing:6px;color:#3fb950;font-weight:bold;">${{ steps.gen.outputs.password }}</span>
              </div>
              <p>🔗 访问地址：<a href="https://zero05060126.github.io/claude-guide/mima.html" style="color:#58a6ff;">https://zero05060126.github.io/claude-guide/mima.html</a></p>
              <p style="color:#8b949e;font-size:0.85em;">⏰ 密码有效期至：明天凌晨 00:00<br>到时系统会自动生成新密码并发送给你。</p>
              <hr style="border-color:#30363d;margin:20px 0;">
              <p style="color:#484f58;font-size:0.8em;">此邮件由 GitHub Actions 自动发送 · 每天北京时间 00:00</p>
            </div>

      - name: 提交并推送更新
        run: |
          git config user.name "Password Bot"
          git config user.email "password-bot@github.com"
          git add mima.html
          git commit -m "🔐 更新每日密码 - $(TZ='Asia/Shanghai' date +'%Y-%m-%d')" || echo "无需提交"
          git push
